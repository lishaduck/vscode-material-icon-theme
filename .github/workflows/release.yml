name: Release + Publish

on:
  workflow_dispatch:
    inputs:
      versionChange:
        type: choice
        description: Select the version change
        required: true
        default: 'minor'
        options:
          - major
          - minor
          - patch

permissions: {}

defaults:
  run:
    shell:
      bash

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CHANGE: ${{ github.event.inputs.versionChange }}

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Platform 🛠
        uses: oven-sh/setup-bun@123c6c4e2fea3eb7bffaa91a85eb6b3d505bf7af # v2
        with:
          bun-version: 1.1.18

      - name: Install dependencies 📦
        run: |
          bun install --frozen-lockfile
          bun add -g npm

      - name: Update version ↗
        run: |
          git config --global user.name 'Philipp Kief'
          git config --global user.email 'PKief@users.noreply.github.com'
          git config --global push.followTags true
          npm version ${VERSION_CHANGE} -m "Release %s"

      - name: Get metadata 🔍
        id: metadata
        run: |
          VERSION=$(jq -r '.version' package.json)
          NAME=$(jq -r '.name' package.json)
          DISPLAY_NAME=$(jq -r '.displayName' package.json)
          echo version=$VERSION >> $GITHUB_OUTPUT
          echo name=$NAME >> $GITHUB_OUTPUT
          echo display-name=$DISPLAY_NAME >> $GITHUB_OUTPUT

      - name: Build ⚒️
        run: bunx @vscode/vsce package

      - name: Push tags 📌
        run: git push

      - name: Release ${{ steps.metadata.outputs.version }} 🔆
        uses: softprops/action-gh-release@a74c6b72af54cfa997e81df42d94703d6313a2d0 # v2.0.6
        with:
          files: ${{ steps.metadata.outputs.name }}-${{ steps.metadata.outputs.version }}.vsix
          tag_name: v${{ steps.metadata.outputs.version }}
          name: ${{ steps.metadata.outputs.display-name }} v${{ steps.metadata.outputs.version }}
          generate_release_notes: true

      - name: Publish to Open VSX Registry 🌐
        uses: HaaLeo/publish-vscode-extension@28e2d3f5817fccf23c1f219eb0cecc903132d1a2 # v1.6.2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: ${{ steps.metadata.outputs.name }}-${{ steps.metadata.outputs.version }}.vsix

      - name: Publish to Visual Studio Marketplace 🌐
        uses: HaaLeo/publish-vscode-extension@28e2d3f5817fccf23c1f219eb0cecc903132d1a2 # v1.6.2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.metadata.outputs.name }}-${{ steps.metadata.outputs.version }}.vsix

      - name: Publish to NPM Registry 🌐
        run: |
          npm set "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}"
          npm publish --provenance --access public
